<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#292a2b">
  <title>Owner sign-in — Kamerton</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%23292a2b'/%3E%3Cpath d='M13 9v10a7 7 0 0 0 14 0V9M20 26v7' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <header class="login-header">
    <div class="brand"><svg class="logo" aria-hidden="true" viewBox="0 0 42 42"><rect width="42" height="42" rx="8" fill="#e3e4e0"/><g fill="none" stroke="#292a2b" stroke-linecap="round" stroke-width="3.3"><path d="M11 10v9c0 8 13 8 13 0v-9M17.5 25v8m1-23v8M29 10v13"/></g></svg><div><span data-i18n="brand.name">Kamerton</span><small data-i18n="brand.sub">Speech console</small></div></div>
    <div class="lang" role="group" aria-label="Language" data-i18n-aria="lang.label"><button type="button" class="lang-option" data-lang="en" lang="en">EN</button><button type="button" class="lang-option" data-lang="ru" lang="ru">RU</button></div>
  </header>
  <main class="login-main">
    <header class="pagehead"><h1 data-i18n="auth.title">Owner sign-in</h1><p data-i18n="auth.intro">Sign in to manage the console and client API keys.</p></header>
    <form id="login-form" class="panel stack" action="/auth/login" method="post">
      <label class="field" for="login-username"><span data-i18n="auth.username">Username</span><input id="login-username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" type="text" required></label>
      <label class="field" for="login-password"><span data-i18n="auth.password">Password</span><input id="login-password" name="password" autocomplete="current-password" type="password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button id="login-submit" class="primary" type="submit" data-i18n="auth.signIn" disabled>Sign in</button>
      <noscript>Enable JavaScript to sign in. Для входа включите JavaScript.</noscript>
    </form>
  </main>
  <script src="/static/i18n.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
