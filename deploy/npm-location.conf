# Для Nginx Proxy Manager 2.17.1: блок Advanced самого Proxy Host.
# Не добавляйте отдельный Custom Location «/». Включите сертификат и Force SSL.
# Scheme = http, Forward Hostname / IP = KAMERTON_BIND, Forward Port = KAMERTON_PORT.
# Этот блок заменяет штатный location /, включая правила NPM Access List этого location.
# При необходимости добавьте сюда нужные правила доступа; проверьте `nginx -t` и `nginx -T`.
location / {
    proxy_pass $forward_scheme://$server:$port$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # IP соединения до подмены модулем realip по входящим заголовкам.
    proxy_set_header X-Kamerton-Client-IP $realip_remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";

    # SSE и длинное распознавание не должны ждать буфера или короткого тайм-аута.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    # MAX_UPLOAD_MB (по умолчанию 150) плюс запас на обёртку multipart.
    client_max_body_size 151m;
    access_log off;
}
