services:
  stt-api:
    build:
      context: .
      args:
        GIGASTT_TAG: ${GIGASTT_TAG:-2.18.0}
    image: stt-api-console:latest
    container_name: stt-api
    # Docker's init reaps the engine process if the console ever dies unexpectedly.
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # Слева — порт на сервере, справа — порт внутри контейнера (не меняйте).
      - "${HOST_PORT:-8091}:8080"
    volumes:
      - ./data:/data      # состояние, глоссарий
      - ./models:/models  # веса моделей, ~250 МБ на голову
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Потолок памяти — страховка хосту, а не попытка ужать движок. В работе
    # контейнер держит ~120 МиБ; потолок задаётся не по этой цифре, а по самому
    # тяжёлому мигу за всё время жизни — пересборке оптимизированного графа после
    # смены головы или обновления движка. Замерено на 2.17.0: 1078 МиБ для
    # `e2e_rnnt` и 2538 МиБ для `ml_ctc_large`, у которой энкодер на 600M. Отсюда
    # 3 ГБ: два гигабайта убивали бы большую голову ровно в момент её первого
    # запуска. POOL_SIZE добавляет всего ~20 МиБ на сессию.
    # memswap_limit равен mem_limit намеренно: иначе Docker разрешает вдвое больше
    # за счёт свопа, и вместо честной перезагрузки сервис уйдёт в долгую пробуксовку.
    # Не подходит — уберите обе строки, ограничений по умолчанию нет.
    mem_limit: 3g
    memswap_limit: 3g
    # Движок пишет строку на каждый запрос, а `json-file` по умолчанию растёт без
    # предела: 30 МБ на контейнер — это несколько недель диктовки и достаточно,
    # чтобы разобраться в любом падении.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Движок слушает только 127.0.0.1 внутри контейнера и наружу не публикуется:
    # снаружи доступна только консоль, которая проверяет API-ключ.
