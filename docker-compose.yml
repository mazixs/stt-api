services:
  stt-api:
    build:
      context: .
      args:
        # Keep the direct-build default in Dockerfile in sync.
        GIGASTT_TAG: ${GIGASTT_TAG:-2.22.0}
    image: stt-api-console:latest
    container_name: stt-api
    # Reap the engine if the console exits unexpectedly.
    init: true
    # Allow for Uvicorn's 15s request drain and engine cleanup.
    stop_grace_period: 45s
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # A reverse proxy on the host can use this loopback port directly.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8091}:8080"
    volumes:
      - ./data:/data
      - ./models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # First-run graph optimization peaked at 2538 MiB; disable swap to avoid stalls.
    # Peak measurements and log rotation rationale: docs/decisions.md (11.08.2026).
    mem_limit: 3g
    memswap_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
