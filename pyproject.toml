[project]
name = "stt-api-console"
dynamic = ["version"]
description = "Web console and OpenAI-compatible facade for the GigaSTT (GigaAM v3) speech recognition engine"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    # httpx не задаёт нижнюю границу для хранилища корней TLS (GHSA-6q48-6c7w-9gw2).
    "certifi>=2026.10.23",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.setuptools]
packages = ["console"]

[tool.setuptools.package-data]
console = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "console.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
