[project]
name = "stt-api-console"
version = "0.1.0"
description = "Web console and OpenAI-compatible facade for the GigaSTT (GigaAM v3) speech recognition engine"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.setuptools]
packages = ["console"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
